server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hyperniche-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/hyperniche;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

supabase:
  url: ${SUPABASE_URL:https://dlmedpigamprmcbloxvk.supabase.co}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:your-supabase-jwt-secret-placeholder}
    issuer: ${SUPABASE_URL:https://dlmedpigamprmcbloxvk.supabase.co}/auth/v1

instagram:
  app-id: ${INSTAGRAM_APP_ID:}
  app-secret: ${INSTAGRAM_APP_SECRET:}
  redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/v1/instagram/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  api-version: ${INSTAGRAM_API_VERSION:v27.0}
  token-encryption-key: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY:}
  webhook-verify-token: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN:}
  workflow-secret: ${INSTAGRAM_WORKFLOW_SECRET:}
  n8n-webhook-url: ${N8N_INSTAGRAM_RETRY_WEBHOOK_URL:}
  sync-cron: ${INSTAGRAM_SYNC_CRON:0 15 3 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
