# Supabase transaction pooler (PgBouncer) rejects named prepared statements.
# prepareThreshold=0 forces simple query mode. Schema is owned by SQL migrations, not Hibernate.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          use_get_generated_keys: true
